# Runs the public test suite.
#
# NOTE: this workflow is RED on the starter code — every test in
# tests/test_contract.py fails by design. Your submission should turn it green.
name: tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
